# Free local DB images for Detour db-client contract tests. No cloud accounts.
# Usage:
#   docker compose -f docker-compose.db.yml up -d cassandra postgres mysql redis mongo
#   DETOUR_DB_E2E=1 corepack pnpm --filter @detour/cli test:db-e2e
#
# Heavy images (oracle, mssql, opensearch) are profile-gated.

name: detour-db

services:
  cassandra:
    image: cassandra:4.1
    ports: ['9042:9042']
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M
    healthcheck:
      test: ['CMD-SHELL', 'cqlsh -e "DESCRIBE KEYSPACES" || exit 1']
      interval: 15s
      timeout: 10s
      retries: 20

  cassandra5:
    image: cassandra:5.0
    profiles: ['cassandra5']
    ports: ['9043:9042']
    environment:
      MAX_HEAP_SIZE: 512M
      HEAP_NEWSIZE: 128M

  scylla:
    image: scylladb/scylla:5.4
    profiles: ['scylla']
    ports: ['9044:9042']
    command: ['--smp', '1', '--memory', '512M', '--overprovisioned', '1']

  postgres:
    image: postgres:16-alpine
    ports: ['5432:5432']
    environment:
      POSTGRES_PASSWORD: detour
      POSTGRES_USER: detour
      POSTGRES_DB: detour
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U detour']
      interval: 5s
      timeout: 5s
      retries: 10

  # TLS Postgres — mount cli/src/db/certs/test/ (generated by e2e setup). Profile: tls
  postgres-tls:
    image: postgres:16-alpine
    profiles: ['tls']
    ports: ['5433:5432']
    environment:
      POSTGRES_PASSWORD: detour
      POSTGRES_USER: detour
      POSTGRES_DB: detour
    volumes:
      - ./cli/src/db/certs/test:/certs:ro
      - ./cli/src/db/certs/pg-tls-init.sh:/docker-entrypoint-initdb.d/00-ssl.sh:ro
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/certs/server.crt
      - -c
      - ssl_key_file=/certs/server.key
      - -c
      - ssl_ca_file=/certs/ca.crt
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U detour']
      interval: 5s
      timeout: 5s
      retries: 10

  mysql:
    image: mysql:8.4
    ports: ['3306:3306']
    environment:
      MYSQL_ROOT_PASSWORD: detour
      MYSQL_DATABASE: detour
      MYSQL_USER: detour
      MYSQL_PASSWORD: detour
    healthcheck:
      test: ['CMD', 'mysqladmin', 'ping', '-h', '127.0.0.1', '-uroot', '-pdetour']
      interval: 8s
      timeout: 5s
      retries: 15

  mariadb:
    image: mariadb:11
    profiles: ['mariadb']
    ports: ['3307:3306']
    environment:
      MARIADB_ROOT_PASSWORD: detour
      MARIADB_DATABASE: detour
      MARIADB_USER: detour
      MARIADB_PASSWORD: detour

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    profiles: ['mssql']
    ports: ['1433:1433']
    environment:
      ACCEPT_EULA: 'Y'
      MSSQL_SA_PASSWORD: 'Detour_Passw0rd'

  oracle:
    image: gvenzl/oracle-free:23-slim
    profiles: ['oracle']
    ports: ['1521:1521']
    environment:
      ORACLE_PASSWORD: detour

  mongo:
    image: mongo:7
    ports: ['27017:27017']
    healthcheck:
      test: ['CMD', 'mongosh', '--eval', 'db.runCommand({ ping: 1 })']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  redis-tls:
    image: redis:7-alpine
    profiles: ['tls']
    ports: ['6380:6379']
    volumes:
      - ./cli/src/db/certs/test:/certs:ro
    command:
      - redis-server
      - --tls-port
      - '6379'
      - --port
      - '0'
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - 'no'

  socks:
    image: serjs/go-socks5-proxy:latest
    profiles: ['tls']
    ports: ['1080:1080']
    environment:
      PROXY_USER: ''
      PROXY_PASSWORD: ''

  clickhouse:
    image: clickhouse/clickhouse-server:24
    profiles: ['clickhouse']
    ports: ['8123:8123', '9000:9000']
    ulimits:
      nofile:
        soft: 262144
        hard: 262144

  opensearch:
    image: opensearchproject/opensearch:2.11.1
    profiles: ['opensearch']
    ports: ['9200:9200']
    environment:
      discovery.type: single-node
      DISABLE_SECURITY_PLUGIN: 'true'
      OPENSEARCH_JAVA_OPTS: '-Xms512m -Xmx512m'

  dynamodb:
    image: amazon/dynamodb-local:2.5.2
    profiles: ['dynamodb']
    ports: ['8000:8000']
    command: '-jar DynamoDBLocal.jar -sharedDb -inMemory'

  bastion:
    image: lscr.io/linuxserver/openssh-server:latest
    profiles: ['ssh', 'tls']
    ports: ['2222:2222']
    environment:
      PUID: '1000'
      PGID: '1000'
      TZ: UTC
      PASSWORD_ACCESS: 'true'
      USER_PASSWORD: detour
      USER_NAME: detour
